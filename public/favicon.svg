<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#581c87" />
    </linearGradient>
  </defs>
  
  <!-- Stacked background certificate layer -->
  <rect x="24" y="16" width="60" height="68" rx="12" fill="#f3e8ff" opacity="0.6" />
  
  <!-- Main certificate layer -->
  <rect x="16" y="24" width="60" height="68" rx="12" fill="url(#iconGrad)" />
  
  <!-- Minimalist document lines -->
  <line x1="28" y1="38" x2="56" y2="38" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  <line x1="28" y1="50" x2="64" y2="50" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  <line x1="28" y1="62" x2="46" y2="62" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  
  <!-- Verification badge with checkmark -->
  <circle cx="62" cy="72" r="14" fill="#ffffff" />
  <path d="M56 72 L60 76 L69 66" fill="none" stroke="#581c87" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
